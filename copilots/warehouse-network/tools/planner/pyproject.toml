[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-web-codex-supply-chain-network-planner"
version = "0.4.0"
description = "Deterministic supply-chain network planning MCP tools for Codex"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "openpyxl>=3.1,<4",
  "ijson>=3.2,<4",
  "charset-normalizer>=3.3,<4",
  "ortools>=9.12,<10",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
supply-chain-network-planner = "supply_chain_planner.network.server:main"

[tool.setuptools]
packages = [
  "supply_chain_planner",
  "supply_chain_planner.data",
  "supply_chain_planner.delivery",
  "supply_chain_planner.network",
  "supply_chain_planner.resources",
  "supply_chain_planner.shared",
]
package-dir = { supply_chain_planner = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
