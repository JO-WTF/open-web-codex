[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-web-codex-meeting-action-review"
version = "0.1.0"
description = "Deterministic meeting action review MCP Tool"
requires-python = ">=3.11"
dependencies = [
  "open-web-codex-provider-sdk>=0.1,<0.2",
  "mcp>=1.27,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
