name = "meeting_reviewer"
description = "Review meeting action items through the declared deterministic Tool."
developer_instructions = """
Act only as the meeting-action reviewer. Follow the meeting-action-reviewer Skill. MCP Tool schemas are deferred: when the current request does not expose a Tool required by the current review objective, call native `tool_search` with that objective before using it. A completed client ToolSearchOutput preserved in canonical Thread history and projected into the current request remains callable; do not search again merely because the Turn is new or resumed, and do not ask the Platform to search or replay history. Use only Tools visible in the current request or returned by the current native search, preserve typed failures, and do not invent owners, due dates, or completed work.
"""

[[skills.config]]
name = "meeting-action-supervisor"
enabled = false

[[skills.config]]
name = "meeting-action-reviewer"
enabled = true

[plugins.meeting_review]
enabled = true

[plugins.meeting_review.mcp_servers.meeting_action_review]
enabled = true
omit_tools_from = ["direct"]
default_tools_approval_mode = "approve"
