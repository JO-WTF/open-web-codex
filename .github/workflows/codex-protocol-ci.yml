name: Codex protocol drift checks

on:
  push:
    paths:
      - "codex/**"
      - "scripts/cargo-build-cache.sh"
      - "scripts/test-codex.sh"
      - ".github/workflows/codex-protocol-ci.yml"
  pull_request:
    paths:
      - "codex/**"
      - "scripts/cargo-build-cache.sh"
      - "scripts/test-codex.sh"
      - ".github/workflows/codex-protocol-ci.yml"

permissions:
  contents: read

jobs:
  schema-fixtures:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: "./scripts/test-codex.sh -p codex-app-server-protocol schema_fixtures::"
        working-directory: .
