<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" aria-labelledby="title desc" role="img" viewBox="0 0 1200 760"><title id="title">供应链网络规划师参考架构</title><desc id="desc">供应链网络规划师由 Agent Profile、Domain Knowledge 与 Skills 构成，Skills 通过 MCP Layer 连接规划数据、地理路由、优化、模拟和交付能力。</desc><defs><style>text{font-family:Inter,&quot;Noto Sans SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#172033}.label,.title{font-weight:700}.title{font-size:30px}.label{font-size:23px}.body{font-size:17px;fill:#46536b}.box{stroke-width:2;rx:18}.arrow{stroke:#66758f;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#66758f" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1200" height="760" fill="#f7f9fc"/><text x="600" y="48" class="title" text-anchor="middle">供应链网络规划师参考架构</text><rect width="1060" height="500" x="70" y="78" fill="#f0ecff" stroke="#7661c9" class="box"/><text x="600" y="118" class="label" text-anchor="middle">Supply Chain Network Planner</text><rect width="940" height="100" x="130" y="150" fill="#fff" stroke="#9383d2" class="box"/><text x="600" y="187" class="label" text-anchor="middle">Agent Profile</text><text x="600" y="222" class="body" text-anchor="middle">Identity · Responsibilities · Scope · Principles · Output Contract</text><rect width="430" height="235" x="130" y="290" fill="#fff" stroke="#9383d2" class="box"/><text x="345" y="330" class="label" text-anchor="middle">Domain Knowledge</text><text x="175" y="372" class="body">• 物流、运输与碳核算标准</text><text x="175" y="405" class="body">• 需求、订单与设施数据</text><text x="175" y="438" class="body">• 服务、库存与成本策略</text><text x="175" y="471" class="body">• 地理、路网与风险数据</text><rect width="430" height="235" x="640" y="290" fill="#fff" stroke="#9383d2" class="box"/><text x="855" y="330" class="label" text-anchor="middle">Skills</text><text x="685" y="372" class="body">• 需求基线与仓网选址</text><text x="685" y="405" class="body">• 多层网络与覆盖路由设计</text><text x="685" y="438" class="body">• 布局、产能、成本与时效模拟</text><text x="685" y="471" class="body">• 韧性、生命周期与方案校验</text><path d="M855 525 V625" class="arrow"/><rect width="940" height="100" x="130" y="625" fill="#eaf8f0" stroke="#3e9a68" class="box"/><text x="600" y="664" class="label" text-anchor="middle">MCP Layer</text><text x="600" y="699" class="body" text-anchor="middle">Planning Data · Geo / Routing · Optimization · Simulation · Deliverables</text></svg>