<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1200 900"><title id="title">领域 Agent 总体逻辑分层</title><desc id="desc">供应链网络规划任务进入 Codex Runtime，Runtime 编排由 Agent Profile、Domain Knowledge 和 Skills 组成的领域层，Skills 调用 MCP Servers 和外部工具。</desc><defs><style>text{font-family:Inter,&quot;Noto Sans SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#172033}.label,.title{font-weight:700}.title{font-size:30px}.label{font-size:24px}.body{font-size:18px;fill:#46536b}.small{font-size:16px;fill:#58657a}.box{stroke-width:2;rx:18}.arrow{stroke:#66758f;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#66758f" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1200" height="900" fill="#f7f9fc"/><text x="600" y="52" class="title" text-anchor="middle">领域 Agent 总体逻辑分层</text><rect width="740" height="105" x="230" y="85" fill="#fff" stroke="#9aa7bc" class="box"/><text x="600" y="125" class="label" text-anchor="middle">User Task</text><text x="600" y="160" class="body" text-anchor="middle">例如：为华东地区规划五年期仓网与运输网络</text><path d="M600 190 V235" class="arrow"/><rect width="900" height="150" x="150" y="235" fill="#e8f1ff" stroke="#4b79c9" class="box"/><text x="600" y="278" class="label" text-anchor="middle">Codex Runtime</text><text x="600" y="316" class="body" text-anchor="middle">理解任务 · 读取上下文 · 生成计划 · 选择 Skills</text><text x="600" y="348" class="body" text-anchor="middle">调用工具 · 管理执行过程 · 汇总结果</text><path d="M600 385 V430" class="arrow"/><rect width="1040" height="285" x="80" y="430" fill="#f0ecff" stroke="#7661c9" class="box"/><text x="600" y="470" class="label" text-anchor="middle">Domain Agent Layer</text><rect width="920" height="75" x="140" y="500" fill="#fff" stroke="#9383d2" class="box"/><text x="600" y="531" class="label" text-anchor="middle">Agent Profile</text><text x="600" y="558" class="small" text-anchor="middle">身份 · 职责 · 边界 · 原则 · 输出要求</text><rect width="410" height="75" x="140" y="610" fill="#fff" stroke="#9383d2" class="box"/><text x="345" y="640" class="label" text-anchor="middle">Domain Knowledge</text><text x="345" y="669" class="small" text-anchor="middle">标准 · 规范 · 模板 · 项目上下文</text><rect width="410" height="75" x="650" y="610" fill="#fff" stroke="#9383d2" class="box"/><text x="855" y="640" class="label" text-anchor="middle">Skills</text><text x="855" y="669" class="small" text-anchor="middle">方法 · 流程 · 校验 · 完成标准</text><path d="M855 685 V760" class="arrow"/><rect width="900" height="100" x="150" y="760" fill="#eaf8f0" stroke="#3e9a68" class="box"/><text x="600" y="800" class="label" text-anchor="middle">MCP Servers / Tools</text><text x="600" y="835" class="body" text-anchor="middle">ERP · WMS · Geo / Routing · Optimization · Simulation · Spreadsheet</text></svg>