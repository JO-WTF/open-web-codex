name = "network_agent"
description = "Define requirements and perform warehouse-network analysis in the authorized Workspace."
developer_instructions = """
You are the native child Role `network_agent` created by the warehouse Supervisor; never act as Root or Supervisor. Act only as the warehouse-network Network Agent. Follow the warehouse-network Skill. Execute data-dependent network or map work only from an exact typed MCP Resource reference supplied by the supervisor or returned by an allowed tool in this Thread. Treat its resource_schema and each allowed Tool input/output schema as the complete handoff contract: call the matching domain Tool directly, and never inspect Workspace files, list or read Resources, rediscover schemas, or reconstruct intermediate payloads first. Do not use shell, Workspace command, Git, jq, or ad-hoc Python to reread raw files, intermediate Resources, or final reports; answer from bounded Tool results and exact typed handoffs. If the reference is absent or unreadable, return needs_data and stop; never search old Artifacts, reports, model text, resource listings, or provider-private storage to reconstruct it. When a Tool returns a typed cross-Tool handoff, pass its arguments unchanged to the named allowed Tool instead of designing an equivalent request. Use Workspace-relative paths only for explicit cross-package handoffs owned by a Tool. Do not infer the business Workspace from the MCP process working directory or construct Resource URIs. Do not load or reverse-read the warehouse-supervisor Skill. Do not create platform-owned workflow or hidden case state, or communicate directly with another Task. Ask for missing business parameters and external-call permission through the original native interaction path; if the user or current Thread already supplied an exact choice, do not ask again.
"""
nickname_candidates = ["Euler", "Harbor"]

[[skills.config]]
name = "warehouse-supervisor"
enabled = false

[[skills.config]]
name = "warehouse-data"
enabled = false

[[skills.config]]
name = "warehouse-network"
enabled = true

[mcp_servers.supply_chain]
command = "__OPEN_WEB_CODEX_SUPPLY_CHAIN_LAUNCHER__"
args = []
enabled = true
required = true
default_tools_approval_mode = "prompt"
enabled_tools = [
  "plan_route_matrix",
  "build_haversine_route_matrix",
  "validate_route_matrix",
  "register_navigation_route_matrix",
  "plan_cost_matrix",
  "prepare_network_distribution_map",
  "evaluate_network_baseline",
  "evaluate_facility_scenario",
  "solve_p_median",
  "compare_network_scenarios",
  "render_network_comparison_map",
  "publish_network_planning_report",
]

[mcp_servers.supply_chain.tools.plan_route_matrix]
approval_mode = "approve"

[mcp_servers.supply_chain.tools.build_haversine_route_matrix]
approval_mode = "approve"

[mcp_servers.supply_chain.tools.validate_route_matrix]
approval_mode = "approve"

[mcp_servers.supply_chain.tools.register_navigation_route_matrix]
approval_mode = "approve"

[mcp_servers.supply_chain.tools.plan_cost_matrix]
approval_mode = "approve"

[mcp_servers.supply_chain.tools.prepare_network_distribution_map]
approval_mode = "approve"

[mcp_servers.supply_chain.tools.evaluate_network_baseline]
approval_mode = "approve"

[mcp_servers.supply_chain.tools.evaluate_facility_scenario]
approval_mode = "approve"

[mcp_servers.supply_chain.tools.solve_p_median]
approval_mode = "approve"

[mcp_servers.supply_chain.tools.compare_network_scenarios]
approval_mode = "approve"

[mcp_servers.supply_chain.env]
CODEX_HOME = "__OPEN_WEB_CODEX_PROFILE_HOME__"
OPEN_WEB_CODEX_DATA_DIR = "__OPEN_WEB_CODEX_PROFILE_RUNTIME__"
OPEN_WEB_CODEX_LOG_DIR = "__OPEN_WEB_CODEX_PROFILE_LOGS__"
OPEN_WEB_CODEX_SUPPLY_CHAIN_MCP_VENV = "__OPEN_WEB_CODEX_SUPPLY_CHAIN_VENV__"
SUPPLY_CHAIN_MCP_AUTO_INSTALL = "0"
PYTHONDONTWRITEBYTECODE = "1"

[mcp_servers.map_utils]
command = "__OPEN_WEB_CODEX_MAPS_LAUNCHER__"
args = ["--workspace-root", "__OPEN_WEB_CODEX_MAPS_STATE_ROOT__"]
cwd = "__OPEN_WEB_CODEX_MAPS_ASSET_ROOT__"
enabled = true
required = true
startup_timeout_sec = 60
tool_timeout_sec = 90
default_tools_approval_mode = "prompt"
enabled_tools = [
  "get_route",
  "distance_matrix",
  "create_map_card",
]

[mcp_servers.map_utils.tools.create_map_card]
approval_mode = "approve"

[mcp_servers.map_utils.env]
CODEX_HOME = "__OPEN_WEB_CODEX_PROFILE_HOME__"
OPEN_WEB_CODEX_DATA_DIR = "__OPEN_WEB_CODEX_PROFILE_RUNTIME__"
OPEN_WEB_CODEX_LOG_DIR = "__OPEN_WEB_CODEX_PROFILE_LOGS__"
OPEN_WEB_CODEX_MAPS_MCP_VENV = "__OPEN_WEB_CODEX_MAPS_VENV__"
MAPS_MCP_VENV = "__OPEN_WEB_CODEX_MAPS_VENV__"
MAPS_MCP_AUTO_INSTALL = "0"
PYTHONDONTWRITEBYTECODE = "1"
