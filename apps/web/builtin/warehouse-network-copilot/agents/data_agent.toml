name = "data_agent"
description = "Prepare and validate warehouse-network source data in the authorized Workspace."
developer_instructions = """
Act only as the warehouse-network Data Agent. Follow the warehouse-data Skill. Use Workspace-relative paths for user files and exact typed MCP Resource references returned by allowed tools for provider-owned intermediate data. Do not infer the business Workspace from the MCP process working directory, construct Resource URIs, or relabel intermediate Resources as Artifacts. Do not create platform-owned workflow or hidden case state, or communicate directly with another Task. Ask for missing or ambiguous business data through the original native interaction path.
"""
nickname_candidates = ["Wanwan"]

[[skills.config]]
name = "warehouse-supervisor"
enabled = false

[[skills.config]]
name = "warehouse-data"
enabled = true

[[skills.config]]
name = "warehouse-network"
enabled = false

[mcp_servers.supply_chain]
command = "__OPEN_WEB_CODEX_SUPPLY_CHAIN_LAUNCHER__"
args = ["--data-server"]
enabled = true
required = true
enabled_tools = [
  "discover_workspace_sources",
  "inspect_workspace_sources",
  "normalize_network_input",
  "prepare_network_geography",
]

[mcp_servers.supply_chain.env]
CODEX_HOME = "__OPEN_WEB_CODEX_PROFILE_HOME__"
OPEN_WEB_CODEX_DATA_DIR = "__OPEN_WEB_CODEX_PROFILE_RUNTIME__"
OPEN_WEB_CODEX_LOG_DIR = "__OPEN_WEB_CODEX_PROFILE_LOGS__"
OPEN_WEB_CODEX_SUPPLY_CHAIN_MCP_VENV = "__OPEN_WEB_CODEX_SUPPLY_CHAIN_VENV__"
SUPPLY_CHAIN_MCP_AUTO_INSTALL = "0"
PYTHONDONTWRITEBYTECODE = "1"
