[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "record-review-provider-cookbook"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["open-web-codex-provider-sdk>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["record_review_provider*"]

[tool.uv.sources]
open-web-codex-provider-sdk = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
