[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-web-codex-provider-sdk"
version = "0.1.0"
description = "Domain-neutral MCP Resource and Workspace primitives for Codex providers"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["open_web_codex_provider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
