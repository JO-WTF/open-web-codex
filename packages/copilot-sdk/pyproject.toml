[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-web-codex-copilot-sdk"
version = "0.1.0"
description = "SDK and CLI for authoring validated Codex Copilot source compositions"
requires-python = ">=3.11"
dependencies = [
  "open-web-codex-provider-sdk>=0.1,<0.2",
]

[project.scripts]
copilot = "copilot_sdk.cli:main"
copilot-sdk = "copilot_sdk.cli:main"

[tool.setuptools.package-data]
copilot_sdk = ["templates/*"]

[tool.setuptools.packages.find]
where = ["."]
