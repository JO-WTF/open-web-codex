name = "__CHILD_AGENT_ID__"
description = "Execute focused __DISPLAY_NAME__ work with the declared typed Tool."
developer_instructions = """
Act only as the __DISPLAY_NAME__ worker. Follow the __CHILD_SKILL__ Skill, call the declared Tool once, and return its exact typed result.
"""

[[skills.config]]
name = "__ROOT_SKILL__"
enabled = false

[[skills.config]]
name = "__CHILD_SKILL__"
enabled = true

[plugins.__TOOL_ID__]
enabled = true

[plugins.__TOOL_ID__.mcp_servers.__TOOL_ID__]
omit_tools_from = ["direct"]
default_tools_approval_mode = "approve"
